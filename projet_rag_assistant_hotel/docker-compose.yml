services:
  api:
    build: .
    command: uvicorn hotel_rag.api:app --host 0.0.0.0 --port 8000     # 1 seul worker : Chroma local
    env_file: .env                          # la clé est injectée à l'exécution
    volumes:
      - ./data:/app/data:ro                 # PDF en lecture seule
      - chroma:/app/.chroma                 # l'index survit aux redémarrages
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui:
    build: .
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000              # nom du service, pas localhost
    ports:
      - "8503:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  chroma: