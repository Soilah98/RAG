[project]
name = "projet-rag-assistant-hotel"
version = "0.1.0"
description = "Assistant RAG pour un hôtel : FastAPI, Streamlit, Chroma, OpenAI"
readme = "README.md"
requires-python = ">=3.12.4"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.115",
    "numpy>=1.26",
    "openai>=3.48.0",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
ui       = ["streamlit>=1.40", "httpx>=0.27"]
gradio   = ["gradio>=6,<7"]
notebook = ["ipykernel>=7.4.0", "matplotlib>=3.11.2", "pandas>=3.1.1", "scikit-learn>=1.9.1",
            "langchain>=1.4.9", "langchain-openai>=1.7.4"]
dev      = ["pytest", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]